name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A FIBO é publicada por terceiros e muda sem aviso. Semanal para
    # descobrir um alinhamento quebrado antes de um contribuidor descobrir.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  ROBOT_VERSION: v1.9.7
  # sha256 do robot.jar publicado nesse release. Se o download não bater,
  # é jar corrompido ou release adulterado — falha antes de rodar java -jar
  # em algo não verificado.
  ROBOT_SHA256: 91890c2e83d0f092dd08731376f154b36610544cfbe8685337a1bf7244ccaa2d

jobs:
  # O que o CONTRIBUTING.md pedia manualmente ("carregar no Protégé sem erros",
  # "verificar consistência com um reasoner") — agora executado.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache do robot.jar
        id: robot-cache
        uses: actions/cache@v4
        with:
          path: robot.jar
          key: robot-jar-${{ env.ROBOT_VERSION }}-${{ env.ROBOT_SHA256 }}

      - name: Instalar o ROBOT
        run: |
          if [ ! -f robot.jar ]; then
            curl -sSL -o robot.jar \
              "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"
          fi
          echo "${ROBOT_SHA256}  robot.jar" | sha256sum -c -
          printf '#!/bin/sh\nexec java -Xmx4g -jar "%s/robot.jar" "$@"\n' "$PWD" > /usr/local/bin/robot
          chmod +x /usr/local/bin/robot
          robot --version

      # XML mal-formado falha aqui, antes de qualquer coisa mais cara.
      - name: Merge core + módulos + exemplos
        run: |
          robot merge \
            --input ontology/bfo-core.owl \
            --input ontology/bfo-openfinance-mapping.owl \
            --input ontology/bfo-bcb-mapping.owl \
            --input examples/bfo-examples.owl \
            --output merged.owl

      - name: Perfil OWL 2 DL
        run: robot validate-profile --profile DL --input merged.owl

      # Falha se a ontologia for inconsistente ou se qualquer classe for
      # insatisfazível. Só tem sentido porque o core declara disjunções.
      - name: Reasoner (HermiT)
        run: robot reason --reasoner HermiT --input merged.owl --output reasoned.owl

      - name: Anotações obrigatórias
        run: robot verify --input merged.owl --queries queries/anotacoes-obrigatorias.rq --output-dir .

      - name: Rótulos duplicados
        run: robot verify --input merged.owl --queries queries/rotulos-duplicados.rq --output-dir .

      # Informativo, NÃO bloqueia o merge. O perfil padrão do `robot report` é
      # feito para ontologias OBO: cobra definição em IAO:0000115 (usamos
      # skos:definition) e trata rótulo bilíngue como erro (é feature nossa,
      # está no README). As regras que de fato valem aqui viraram as consultas
      # em queries/, onde o critério é explícito e o nome não depende de qual
      # versão do ROBOT está instalada.
      - name: Relatório do ROBOT (informativo)
        continue-on-error: true
        run: |
          robot report --input merged.owl --output report.tsv || true
          {
            echo "### Relatório do ROBOT"
            echo
            echo "Violações por regra:"
            echo '```'
            tail -n +2 report.tsv | cut -f1,2 | sort | uniq -c | sort -rn
            echo '```'
            echo
            echo "Todas as linhas de nível ERROR:"
            echo '```'
            awk -F'\t' 'NR == 1 || $1 == "ERROR"' report.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: report.tsv

  # Turtle é muito mais legível que RDF/XML. Gerado aqui em vez de versionado,
  # para não haver duas fontes da verdade a divergir.
  turtle:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache do robot.jar
        uses: actions/cache@v4
        with:
          path: robot.jar
          key: robot-jar-${{ env.ROBOT_VERSION }}-${{ env.ROBOT_SHA256 }}
      - name: Instalar o ROBOT
        run: |
          if [ ! -f robot.jar ]; then
            curl -sSL -o robot.jar \
              "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"
          fi
          echo "${ROBOT_SHA256}  robot.jar" | sha256sum -c -
          printf '#!/bin/sh\nexec java -Xmx4g -jar "%s/robot.jar" "$@"\n' "$PWD" > /usr/local/bin/robot
          chmod +x /usr/local/bin/robot

      - name: Converter para Turtle
        run: |
          mkdir -p dist
          for f in ontology/bfo-core.owl ontology/bfo-openfinance-mapping.owl \
                   ontology/bfo-bcb-mapping.owl examples/bfo-examples.owl; do
            robot convert --input "$f" --format ttl \
              --output "dist/$(basename "${f%.owl}").ttl"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: turtle
          path: dist/

  # Baixa a FIBO de verdade. É o único job que prova que os alinhamentos
  # apontam para termos existentes — na v1.1.0 os 35 eram inventados e nada
  # no repositório era capaz de perceber.
  fibo-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache do robot.jar
        uses: actions/cache@v4
        with:
          path: robot.jar
          key: robot-jar-${{ env.ROBOT_VERSION }}-${{ env.ROBOT_SHA256 }}
      - name: Instalar o ROBOT
        run: |
          if [ ! -f robot.jar ]; then
            curl -sSL -o robot.jar \
              "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"
          fi
          echo "${ROBOT_SHA256}  robot.jar" | sha256sum -c -
          printf '#!/bin/sh\nexec java -Xmx8g -jar "%s/robot.jar" "$@"\n' "$PWD" > /usr/local/bin/robot
          chmod +x /usr/local/bin/robot

      # Falha se qualquer owl:imports da FIBO não resolver.
      - name: Merge com a FIBO
        run: |
          robot merge \
            --input ontology/bfo-fibo-alignment.owl \
            --catalog ontology/catalog-v001.xml \
            --collapse-import-closure true \
            --output merged-fibo.owl

      - name: Alinhamentos apontam para termos que existem na FIBO
        run: robot verify --input merged-fibo.owl --queries queries/alinhamentos-fantasma.rq --output-dir .

  # O .htaccess só é ativado quando o PR em perma-id/w3id.org for aceito
  # (ver w3id/README.md), então ninguém percebe se ele apontar para um
  # arquivo que foi renomeado ou removido. Checagem estática, sem rede.
  w3id-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Caminhos do .htaccess existem no repositório
        run: |
          set -e
          htaccess=w3id/bfo-br/.htaccess
          # Alvos github.io apontam para caminhos deste repo (ontology/, dist/);
          # dist/ é gerado pelo job `turtle` a partir de ontology/, então
          # validamos a fonte .owl correspondente em vez do .ttl inexistente aqui.
          grep -oE 'brolesi\.github\.io/bfo/[A-Za-z0-9_./-]+' "$htaccess" | sed 's#.*/bfo/##' | sort -u |
          while read -r path; do
            case "$path" in
              dist/*.ttl)
                src="ontology/$(basename "${path%.ttl}").owl"
                [ -f "$src" ] || { echo "::error::$htaccess referencia $path, mas $src não existe"; exit 1; }
                ;;
              *)
                [ -f "$path" ] || { echo "::error::$htaccess referencia $path, que não existe"; exit 1; }
                ;;
            esac
          done

  # CONTRIBUTING.md pede para atualizar o CHANGELOG a cada mudança de
  # conteúdo, mas isso é fácil de esquecer num PR. Só roda em PR — não faz
  # sentido em push direto a main nem no cron semanal da FIBO.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: CHANGELOG.md atualizado quando a ontologia muda
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          if echo "$changed" | grep -qE '^ontology/.*\.owl$' && ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
            echo "::error::PR muda arquivo(s) em ontology/ mas não atualiza CHANGELOG.md"
            exit 1
          fi
